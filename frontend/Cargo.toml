[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.13.0"
getrandom = {version = "0.4.2", features = ["wasm_js"]}
gloo-timers = {version = "0.4.0", features = ["futures"]}
instant = {version = "0.1.13", features = ["wasm-bindgen"]}
lazy_static = "1.5.0"
rand = "0.10.1"
wasm-bindgen-futures = "0.4.75"
yew = {version = "0.23.0",  features = ["csr"]}
